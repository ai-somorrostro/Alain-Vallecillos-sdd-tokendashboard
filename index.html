<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Modelos de IA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Dashboard de Modelos Open Source</h1>
    <p class="subtitle">Comparativa de modelos de lenguaje para el equipo</p>
  </header>

  <main class="main">
    <section class="table-wrap">
      <table id="models-table">
        <thead>
          <tr>
            <th scope="col">Modelo</th>
            <th scope="col">Precio entrada</th>
            <th scope="col">Precio salida</th>
            <th scope="col">TTFT</th>
            <th scope="col">Entrada</th>
            <th scope="col">Salida</th>
            <th scope="col">Tokens/día (ent.)</th>
            <th scope="col">Tokens/día (sal.)</th>
            <th scope="col">Tokens/semana (ent.)</th>
            <th scope="col">Tokens/semana (sal.)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
